name: Publish to Docker Hub

# ==============================================================================
# GitHub Actions Workflow: Publish Docker Image to Docker Hub
# Target Repository: https://hub.docker.com/repository/docker/hugokoo/dns-worker/
#
# Requirements (Repository Secrets):
# - DOCKERHUB_TOKEN (or DOCKER_TOKEN): Docker Hub Personal Access Token (PAT)
# - DOCKERHUB_USERNAME: (Optional) Docker Hub username (defaults to 'hugokoo')
# ==============================================================================

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave blank to auto-detect from latest Git tag)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish_docker:
    name: Build and Publish Multi-Arch Image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Determine and sync package version
        id: meta
        run: |
          VERSION=""

          # 1. If manually provided via workflow_dispatch input
          if [ -n "${{ inputs.version }}" ]; then
            INPUT_VER="${{ inputs.version }}"
            VERSION="${INPUT_VER#v}"
            echo "Using version from workflow input: $VERSION"

          # 2. If triggered by a Git tag push (e.g. refs/tags/v1.1.3)
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            VERSION="${TAG_NAME#v}"
            echo "Using version from tag push: $VERSION"

          # 3. If triggered on a branch (e.g. main) via workflow_dispatch without input,
          #    auto-detect the latest Git tag
          else
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            if [ -n "$LATEST_TAG" ]; then
              VERSION="${LATEST_TAG#v}"
              echo "Auto-detected latest tag from Git: $VERSION (from $LATEST_TAG)"
            fi
          fi

          # Apply version to package.json if detected
          if [ -n "$VERSION" ]; then
            echo "Syncing package.json version to: $VERSION"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "Could not determine version from tag; keeping package.json version: $VERSION"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'hugokoo' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN }}

      - name: Build and push Multi-Arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            hugokoo/dns-worker:latest
            hugokoo/dns-worker:${{ steps.meta.outputs.version }}
            hugokoo/dns-worker:v${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
